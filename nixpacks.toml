# Nixpacks (servicio backend en Railway).
#
# Puppeteer genera las tarjetas de regalo (integrations/cards) en el servidor.
# Con .puppeteerrc.cjs → skipDownload:true NO bajamos el Chrome de puppeteer, así
# que necesitamos un Chromium del sistema.
#
# IMPORTANTE: la base de Nixpacks es Ubuntu, donde el paquete apt `chromium` es un
# stub de snap roto ("requires the chromium snap") → no sirve. Por eso instalamos
# Chromium con NIX (`nixPkgs`), que trae un binario real y autocontenido con todas
# sus librerías. Queda en el PATH como `chromium`; integrations/cards/generate.js
# lo resuelve con `command -v chromium`.
#
# El "..." preserva los paquetes que Nixpacks detecta solo (Node, etc.).
[phases.setup]
nixPkgs = ["...", "chromium"]
