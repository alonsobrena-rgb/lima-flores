<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Lima Flores</title>
<meta name="theme-color" content="#F4EFE5" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lima.css?v=20260526-9" />
<style>
  body { background: #F4EFE5; color: #1a1a1a; font-family: var(--f-body); }
  .admin-wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
  .admin-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 28px; gap: 20px; flex-wrap: wrap; }
  .admin-title { font-family: var(--f-display); font-style: italic; font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 400; line-height: 1.05; margin: 0; }
  .admin-title em { color: var(--terra); font-style: italic; }
  .admin-meta { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .admin-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .admin-tab { padding: 12px 18px; font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; border: none; background: transparent; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
  .admin-tab.is-active { color: var(--ink); border-bottom-color: var(--terra); }
  .admin-tab:hover { color: var(--ink); }
  .admin-empty { padding: 64px 0; text-align: center; color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 1.4rem; }
  .order-card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 24px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .order-card.is-loading { opacity: 0.55; pointer-events: none; }
  .order-card__id { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 6px; }
  .order-card__recipient { font-family: var(--f-display); font-style: italic; font-size: 1.6rem; color: var(--ink); margin: 0 0 14px; line-height: 1.1; }
  .order-card__row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 4px 0; font-size: 0.92rem; line-height: 1.45; }
  .order-card__row dt { color: var(--ink-soft); font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 3px; }
  .order-card__row dd { margin: 0; color: var(--ink); }
  .order-card__items { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px dashed var(--line); }
  .order-card__item { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.9rem; }
  .order-card__total { font-weight: 600; font-size: 1.05rem; padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .order-card__side { display: flex; flex-direction: column; gap: 10px; min-width: 180px; }
  .badge { display: inline-block; padding: 4px 10px; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; }
  .badge-pending    { background: #fef3c7; color: #92400e; }
  .badge-dispatched { background: #d1fae5; color: #065f46; }
  .badge-cancelled  { background: #fee2e2; color: #991b1b; }
  .btn-dispatch { padding: 12px 18px; background: var(--ink); color: var(--bone); border: none; border-radius: 4px; font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background .2s; }
  .btn-dispatch:hover { background: var(--terra); }
  .btn-dispatch:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-cancel { padding: 10px 14px; background: transparent; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .btn-cancel:hover { color: #991b1b; border-color: #991b1b; }
  .btn-map { padding: 8px 12px; background: transparent; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; font-size: 0.78rem; cursor: pointer; text-decoration: none; text-align: center; }
  .btn-map:hover { color: var(--ink); border-color: var(--ink); }
  .error-bar { padding: 8px 12px; background: #fee2e2; color: #991b1b; border-radius: 4px; font-size: 0.85rem; margin-top: 8px; }
  .status-info { padding: 10px 12px; background: #f3f4f6; color: var(--ink-soft); border-radius: 4px; font-size: 0.85rem; margin-top: 8px; line-height: 1.4; }
  .dispatched-link { font-size: 0.85rem; color: var(--terra); text-decoration: underline; }
  .card-preview { margin-top: 12px; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
  .card-preview__label { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 10px; }
  .card-preview__img { width: 180px; max-width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px; box-shadow: 0 6px 22px rgba(27,26,23,0.12); display: block; background: var(--bone); }
  .card-preview__actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn-card { padding: 8px 12px; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; cursor: pointer; text-decoration: none; border: 1px solid var(--ink); background: var(--ink); color: var(--bone); }
  .btn-card:hover { background: var(--terra); border-color: var(--terra); }
  .btn-card--ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn-card--ghost:hover { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-card:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (max-width: 720px) {
    .order-card { grid-template-columns: 1fr; }
    .order-card__side { flex-direction: row; flex-wrap: wrap; }
    .order-card__row { grid-template-columns: 100px 1fr; font-size: 0.86rem; }
  }

  /* ─── Login overlay ─────────────────────────────────── */
  .login-overlay { position: fixed; inset: 0; background: #F4EFE5; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .login-overlay.is-open { display: flex; }
  .login-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .login-card h2 { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 1.8rem; margin: 0 0 6px; color: var(--ink); }
  .login-card h2 em { color: var(--terra); }
  .login-card p { margin: 0 0 22px; font-size: 0.88rem; color: var(--ink-soft); }
  .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .login-field label { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .login-field input { width: 100%; padding: 12px 14px; font-size: 16px; font-family: var(--f-body); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
  .login-field input:focus { outline: none; border-color: var(--terra); }
  .login-submit { width: 100%; margin-top: 8px; padding: 14px; background: var(--ink); color: var(--bone); border: none; border-radius: 4px; font-family: var(--f-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background .2s; }
  .login-submit:hover:not(:disabled) { background: var(--terra); }
  .login-submit:disabled { opacity: 0.5; cursor: wait; }
  .login-error { margin-top: 14px; padding: 10px 12px; background: #fee2e2; color: #991b1b; border-radius: 4px; font-size: 0.85rem; display: none; }
  .login-error.is-visible { display: block; }
  .btn-logout { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .btn-logout:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<div class="login-overlay" id="login-overlay" aria-hidden="true">
  <form class="login-card" id="login-form" autocomplete="on">
    <h2>Admin · <em>Lima Flores</em></h2>
    <p>Ingresa tus credenciales para ver los pedidos.</p>
    <div class="login-field">
      <label for="login-user">Usuario</label>
      <input id="login-user" name="username" type="text" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required />
    </div>
    <div class="login-field">
      <label for="login-pass">Contraseña</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="login-submit" id="login-submit">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<div class="admin-wrap">
  <div class="admin-head">
    <div>
      <h1 class="admin-title">Pedidos · <em>Lima Flores</em></h1>
      <div class="admin-meta" id="admin-meta">cargando…</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <a class="admin-meta" href="https://logistics.cabify.com/parcels?group=all&history=actives" target="_blank" rel="noopener">Dashboard Cabify →</a>
      <button class="btn-logout" id="btn-logout" type="button">Salir</button>
    </div>
  </div>

  <div class="admin-tabs" role="tablist">
    <button class="admin-tab is-active" data-status="pending"    role="tab">Pendientes</button>
    <button class="admin-tab"            data-status="dispatched" role="tab">Despachados</button>
    <button class="admin-tab"            data-status="cancelled"  role="tab">Cancelados</button>
    <button class="admin-tab"            data-status="all"        role="tab">Todos</button>
  </div>

  <div id="orders-list"></div>
</div>

<script>
(function() {
  const listEl = document.getElementById('orders-list');
  const metaEl = document.getElementById('admin-meta');
  const tabs = document.querySelectorAll('.admin-tab');
  const loginOverlay = document.getElementById('login-overlay');
  const loginForm = document.getElementById('login-form');
  const loginUser = document.getElementById('login-user');
  const loginPass = document.getElementById('login-pass');
  const loginSubmit = document.getElementById('login-submit');
  const loginError = document.getElementById('login-error');
  const btnLogout = document.getElementById('btn-logout');
  let currentStatus = 'pending';

  function showLogin(msg) {
    loginOverlay.classList.add('is-open');
    loginOverlay.setAttribute('aria-hidden', 'false');
    if (msg) {
      loginError.textContent = msg;
      loginError.classList.add('is-visible');
    } else {
      loginError.classList.remove('is-visible');
    }
    setTimeout(() => loginUser.focus(), 50);
  }

  function hideLogin() {
    loginOverlay.classList.remove('is-open');
    loginOverlay.setAttribute('aria-hidden', 'true');
    loginError.classList.remove('is-visible');
    loginPass.value = '';
  }

  const formatSoles = (n) => 'S/ ' + (Number(n) || 0).toFixed(2);
  const escape = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' });
  };

  async function load(status) {
    currentStatus = status;
    metaEl.textContent = 'cargando…';
    listEl.innerHTML = '';
    try {
      const r = await fetch('/api/admin/orders?status=' + encodeURIComponent(status), { credentials: 'include' });
      if (r.status === 401) { showLogin(); metaEl.textContent = '—'; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const orders = data.orders || [];
      metaEl.textContent = `${orders.length} pedido${orders.length === 1 ? '' : 's'} · ${status}`;
      if (orders.length === 0) {
        listEl.innerHTML = `<div class="admin-empty">No hay pedidos ${status === 'all' ? 'todavía' : 'en este estado'}.</div>`;
        return;
      }
      listEl.innerHTML = orders.map(renderOrder).join('');
      bindActions();
    } catch (e) {
      listEl.innerHTML = `<div class="admin-empty">Error: ${escape(e.message)}</div>`;
      metaEl.textContent = 'error';
    }
  }

  function renderOrder(o) {
    const items = Array.isArray(o.items) ? o.items : [];
    const itemsHtml = items.map((it) => `
      <div class="order-card__item">
        <span>${escape(it.name || it.id)} × ${it.qty}</span>
        <span>${formatSoles((Number(it.price) || 0) * (Number(it.qty) || 0))}</span>
      </div>
    `).join('');

    const badgeClass = `badge-${o.status}`;
    const mapsUrl = (o.recipient_lat && o.recipient_lng)
      ? `https://www.google.com/maps?q=${o.recipient_lat},${o.recipient_lng}`
      : '#';

    const dispatchedInfo = o.status === 'dispatched' && o.cabify_order_id
      ? `<div class="status-info">
           <strong>Cabify ID:</strong> ${escape(o.cabify_order_id)}<br>
           <strong>Despachado:</strong> ${formatDate(o.dispatched_at)}<br>
           <a class="dispatched-link" href="https://logistics.cabify.com/parcels?group=all&history=actives" target="_blank" rel="noopener">Ver en Cabify →</a>
         </div>`
      : '';

    const errorBar = o.dispatch_error
      ? `<div class="error-bar">⚠️ Último intento: ${escape(o.dispatch_error)}</div>`
      : '';

    let actions = '';
    if (o.status === 'pending') {
      actions = `
        <button class="btn-dispatch" data-action="dispatch" data-id="${escape(o.id)}">Despachar a Cabify</button>
        <a class="btn-map" href="${mapsUrl}" target="_blank" rel="noopener">📍 Ver en mapa</a>
        <button class="btn-cancel" data-action="cancel" data-id="${escape(o.id)}">Cancelar pedido</button>
      `;
    } else if (o.status === 'dispatched') {
      actions = `<a class="btn-map" href="${mapsUrl}" target="_blank" rel="noopener">📍 Ver en mapa</a>`;
    }

    return `
      <div class="order-card" data-order-id="${escape(o.id)}">
        <div>
          <div class="order-card__id">${escape(o.id)} · <span class="badge ${badgeClass}">${o.status}</span> · ${formatDate(o.created_at)}</div>
          <h3 class="order-card__recipient">Para ${escape(o.recipient_name)}</h3>
          <dl style="margin:0;display:grid;gap:0;">
            <div class="order-card__row"><dt>Entrega</dt><dd>${escape(o.delivery_date)} · ${escape(o.delivery_time)} (±30 min)</dd></div>
            <div class="order-card__row"><dt>Dirección</dt><dd>${escape(o.recipient_address)}${o.recipient_apt ? ' · Dpto ' + escape(o.recipient_apt) : ''}${o.recipient_address_ref ? ' · ' + escape(o.recipient_address_ref) : ''}</dd></div>
            <div class="order-card__row"><dt>Recepción</dt><dd>${o.recipient_has_reception ? 'Sí hay' : 'No hay'}</dd></div>
            <div class="order-card__row"><dt>Tel. recibe</dt><dd>${escape(o.recipient_phone)}</dd></div>
            ${o.card_note ? `<div class="order-card__row"><dt>Tarjeta</dt><dd>"${escape(o.card_note)}"</dd></div>` : ''}
            ${o.card_anonymous ? `<div class="order-card__row"><dt>Firma</dt><dd><span class="badge" style="background:#fde68a;color:#92400e;">🕶 Anónimo · no incluir nombre de quien envía</span></dd></div>` : ''}
            <div class="order-card__row"><dt>Comprador</dt><dd>${escape(o.buyer_name)} · ${escape(o.buyer_email)} · ${escape(o.buyer_phone)}</dd></div>
            <div class="order-card__row"><dt>Comprobante</dt><dd>${escape(o.invoice_type)} · ${escape(o.invoice_doc)}${o.invoice_name ? ' · ' + escape(o.invoice_name) : ''}</dd></div>
            <div class="order-card__row"><dt>Pago</dt><dd>${escape(o.payment_method)}</dd></div>
          </dl>
          <div class="order-card__items">
            ${itemsHtml}
            <div class="order-card__item"><span>Subtotal</span><span>${formatSoles(o.subtotal)}</span></div>
            <div class="order-card__item"><span>Envío estimado</span><span>${formatSoles(o.shipping_fee)}</span></div>
            <div class="order-card__total"><span>Total</span><span>${formatSoles(o.total)}</span></div>
          </div>
          ${o.card_note ? cardPreview(o) : ''}
          ${errorBar}
          ${dispatchedInfo}
        </div>
        <div class="order-card__side">${actions}</div>
      </div>
    `;
  }

  // Vista previa de la tarjeta de regalo (PNG autogenerado a partir del mensaje).
  // La imagen se sirve por /api/admin/orders/:id/card (la genera al vuelo si falta).
  function cardPreview(o) {
    const id = escape(o.id);
    const src = `/api/admin/orders/${encodeURIComponent(o.id)}/card`;
    const tpl = o.card_template ? ` · plantilla ${escape(o.card_template)}` : '';
    return `
      <div class="card-preview" data-card-id="${id}">
        <div class="card-preview__label">Tarjeta de regalo${tpl}</div>
        <img class="card-preview__img" src="${src}" alt="Tarjeta de ${id}" loading="lazy" />
        <div class="card-preview__actions">
          <a class="btn-card" href="${src}" download="tarjeta-${id}.png">⬇ Descargar PNG</a>
          <button class="btn-card btn-card--ghost" data-action="card-regen" data-id="${id}">↻ Otra plantilla</button>
        </div>
      </div>`;
  }

  function bindActions() {
    listEl.querySelectorAll('[data-action="dispatch"]').forEach((btn) => {
      btn.addEventListener('click', () => dispatchOrder(btn.dataset.id, btn));
    });
    listEl.querySelectorAll('[data-action="cancel"]').forEach((btn) => {
      btn.addEventListener('click', () => cancelOrder(btn.dataset.id, btn));
    });
    listEl.querySelectorAll('[data-action="card-regen"]').forEach((btn) => {
      btn.addEventListener('click', () => regenCard(btn.dataset.id, btn));
    });
  }

  async function regenCard(id, btn) {
    const wrap = btn.closest('.card-preview');
    const img = wrap && wrap.querySelector('.card-preview__img');
    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Generando…';
    try {
      const r = await fetch(`/api/admin/orders/${encodeURIComponent(id)}/card`, {
        method: 'POST', credentials: 'include',
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || ('HTTP ' + r.status));
      }
      // Forzar recarga de la imagen (cache-bust con timestamp).
      if (img) img.src = `/api/admin/orders/${encodeURIComponent(id)}/card?t=${Date.now()}`;
    } catch (e) {
      alert('No se pudo regenerar la tarjeta: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }

  async function dispatchOrder(id, btn) {
    if (!confirm(`¿Despachar pedido ${id} a Cabify?\n\nEsto creará la orden REAL en Cabify y se asignará un driver.`)) return;
    const card = btn.closest('.order-card');
    card.classList.add('is-loading');
    btn.textContent = 'Despachando…';
    try {
      const r = await fetch(`/api/admin/orders/${encodeURIComponent(id)}/dispatch`, {
        method: 'POST',
        credentials: 'include',
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
      alert(`Despachado.\n\nCabify ID: ${data.cabify_order_id || '(sin id)'}\n\nMonitorea en el dashboard de Cabify.`);
      load(currentStatus);
    } catch (e) {
      alert('Error al despachar: ' + e.message);
      card.classList.remove('is-loading');
      btn.textContent = 'Despachar a Cabify';
    }
  }

  async function cancelOrder(id, btn) {
    if (!confirm(`¿Cancelar pedido ${id}? Esta acción no se puede deshacer.`)) return;
    try {
      const r = await fetch(`/api/admin/orders/${encodeURIComponent(id)}/cancel`, {
        method: 'POST',
        credentials: 'include',
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
      load(currentStatus);
    } catch (e) {
      alert('Error al cancelar: ' + e.message);
    }
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => t.classList.remove('is-active'));
      tab.classList.add('is-active');
      load(tab.dataset.status);
    });
  });

  loginForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const user = loginUser.value.trim();
    const pass = loginPass.value;
    if (!user || !pass) {
      loginError.textContent = 'Ingresa usuario y contraseña.';
      loginError.classList.add('is-visible');
      return;
    }
    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Entrando…';
    loginError.classList.remove('is-visible');
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user, pass }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      hideLogin();
      load(currentStatus);
    } catch (e) {
      loginError.textContent = e.message || 'No se pudo iniciar sesión.';
      loginError.classList.add('is-visible');
      loginPass.select();
    } finally {
      loginSubmit.disabled = false;
      loginSubmit.textContent = 'Entrar';
    }
  });

  btnLogout.addEventListener('click', async () => {
    try { await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }); }
    catch (_) { /* ignore */ }
    showLogin();
  });

  load('pending');
  // Auto-refresh cada 30s mientras la pestaña esté visible y haya sesión.
  setInterval(() => {
    if (!document.hidden && !loginOverlay.classList.contains('is-open')) load(currentStatus);
  }, 30000);
})();
</script>
</body>
</html>
