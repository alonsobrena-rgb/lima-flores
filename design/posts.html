<!-- Cinco posts de Instagram con los tokens de la dirección activa.

     Dos reglas duras:
     · los cinco llevan foto de producto — ninguno es solo tipografía;
     · el logo va directo sobre la foto, sin plaquita. Se usa la versión clara
       (logo-claro.png: letras en marfil, la acuarela intacta) y siempre cae
       sobre una zona oscurecida por un velo, para que se lea sin recuadro.

     Cada post es un cuadrado con `container-type: inline-size`, así que todo
     adentro se mide en cqw y el arte se ve igual a 340 px que a 1080.

     Ningún texto promete entrega el mismo día. -->
<section class="posts">
  <div class="wrap">
    <p class="eti">La marca en Instagram</p>
    <h2 class="postsTitulo">Cinco piezas con el mismo sistema</h2>
    <p class="sisNota">Los mismos colores, la misma tipografía y el mismo logo
    que la tienda. Se deslizan hacia el lado.</p>

    <div class="tira">

      <!-- 1 · la foto manda: el texto se apoya en la sombra, sin recuadros -->
      <figure class="post p-foto">
        <img src="{{IMG:arreglo-rossie-3.jpg@700}}" alt="">
        <div class="veloAlto"></div>
        <div class="veloBajo"></div>
        <img class="firma" src="{{IMG:logo-claro.png@420}}" alt="Lima Flores">
        <div class="txt">
          <h3>Rojo que no pide permiso</h3>
          <p>Arreglo Rossie · S/ 245</p>
        </div>
      </figure>

      <!-- 2 · el precio protagonista, sobre banda plana -->
      <figure class="post p-precio">
        <div class="marco">
          <img src="{{IMG:florero-forti.jpg@700}}" alt="">
          <div class="veloAlto"></div>
          <img class="firma" src="{{IMG:logo-claro.png@420}}" alt="Lima Flores">
        </div>
        <figcaption>
          <span class="eti">Arreglos</span>
          <h3>Florero Forti</h3>
          <div class="fila"><span class="precioPost">S/ 210</span>
            <span class="pastilla">Elige el día y la hora</span></div>
        </figcaption>
      </figure>

      <!-- 3 · partido: media pieza de color con la promesa, media foto -->
      <figure class="post p-partido">
        <div class="lado">
          <h3>Lunes, miércoles y viernes llega el pedido</h3>
          <p>Lo que ves disponible es lo que llegó esta semana.</p>
        </div>
        <div class="marco">
          <img src="{{IMG:tulipanes-de-amor.jpg@620}}" alt="">
          <div class="veloAlto"></div>
          <img class="firma" src="{{IMG:logo-claro.png@420}}" alt="Lima Flores">
        </div>
      </figure>

      <!-- 4 · la promesa de entrega, sobre la foto teñida del color de marca -->
      <figure class="post p-promesa">
        <img src="{{IMG:box-rogelia-3.jpg@700}}" alt="">
        <div class="tinte"></div>
        <img class="firma" src="{{IMG:logo-claro.png@420}}" alt="Lima Flores">
        <div class="txt">
          <h3>Pídelo hoy,<br>llega mañana</h3>
          <p>Eliges el día y una franja de 30 minutos.<br>Cobertura en Lima Metropolitana.</p>
        </div>
        <span class="pie">limaflores.pe</span>
      </figure>

      <!-- 5 · la cuadrícula: lo que hay esta semana, de un vistazo -->
      <figure class="post p-grilla">
        <div class="cuatro">
          <div class="celda"><img src="{{IMG:box-lila.jpg@420}}" alt=""></div>
          <div class="celda"><img src="{{IMG:ramo-luana.jpg@420}}" alt=""></div>
          <div class="celda"><img src="{{IMG:orquidea-sunrise-de-dos-varas.jpg@420}}" alt=""></div>
          <div class="celda"><img src="{{IMG:florero-forti.jpg@420}}" alt=""></div>
        </div>
        <div class="veloAlto"></div>
        <img class="firma" src="{{IMG:logo-claro.png@420}}" alt="Lima Flores">
        <figcaption>
          <h3>Lo de esta semana</h3>
          <span>Desde S/ 180 · 57 piezas disponibles</span>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
